# deploy/nginx.conf
#
# Serving a static site that runs its codec in the page. Three things here matter and the rest is
# default behaviour.
#
# 1. The Wasm module must be served as application/wasm. Without the content type a browser
#    refuses to stream-compile it, and with the fallback path it compiles the whole module as an
#    ArrayBuffer instead. Both work; one is slower and the failure is silent.
# 2. The module must not be cached hard, because a stale page against a new Wasm build is a real
#    failure with nothing in the console. The HTML is uncached for the same reason.
# 3. Every asset is same-origin. A CDN script or a third-party embed means the tool stops working
#    when a third party is down, and it would be a third party seeing what people are marking.

server {
    listen 8080;
    server_name _;
    root /srv/www;
    index index.html;

    charset utf-8;
    server_tokens off;

    # A page that loads a handful of small files does not need a lot of header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/wasm;
    gzip_min_length 1024;

    # Health, for the container healthcheck. Static, no logging, so it cannot fill a disk.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The Wasm module, and the JavaScript modules, both live outside the document root because
    # they are shared with the Node tools rather than being part of the site. `root` is
    # /srv/www, so both need an explicit alias: without one they resolve inside the document root
    # and 404, and the 404 page is served as text/html, so the browser sees a page where it
    # expected a module. That failure is silent, which is why the deployment check curls these
    # paths rather than trusting that the files were copied.
    location = /build/fluidmark_core.wasm {
        alias /srv/build/fluidmark_core.wasm;
        types { application/wasm wasm; }
        default_type application/wasm;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /src/ {
        alias /srv/src/;
        types { application/javascript js mjs; }
        default_type application/javascript;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The page's own files are revalidated every time: the HTML, the script and the stylesheet. A
    # cached `app.js` against a new `/src/` is a stale page against a new module, which is the failure
    # above and shows in no log: the page loads, and calls something the new modules no longer have.
    # The script was once cached for an hour with everything else here, and a browser check that kept
    # its profile between runs is what found it. `no-cache` still lets the browser keep a copy and
    # ask whether it has changed, so the cost is one small request.
    #
    # The pattern is the top level only, `^/name.ext$`. A bare `\.js$` would also match `/src/frame.js`,
    # and a regex location outranks the prefix location for `/src/`, which would then be looked up in
    # the document root and 404 as a web page where a module was expected.
    location ~* ^/[^/]+\.(html|js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = / {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Everything else in www: images added later. Cached, since an image that goes stale is a cosmetic
    # problem rather than a broken tool. Nothing that the page's code depends on belongs here.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=3600" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}