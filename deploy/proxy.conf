# deploy/proxy.conf
#
# What the strandz.it front door needs in order to send the site to the container. It is the
# locations to add to the existing `server` blocks for strandz.it, not a vhost of its own: the
# domain already serves other material, notably /jigdaw/, and a whole-vhost file here would
# replace the certificates, the redirects and that material with whatever this file knew about.
#
# FluidMark takes the root of the domain. nginx picks the longest matching prefix, so an existing
# `location /jigdaw/ { ... }` keeps winning for everything under it and needs no change. Anything
# else the domain served at its root is now shadowed by this. The check in docs/web.md lists the
# paths to confirm are still answering from what they answered from before.
#
# The container serves at its own root and knows nothing about the domain, and every URL in the
# pages is relative, so putting the site under a prefix later means editing this file only.

upstream fluidmark {
    server 127.0.0.1:8080;
    keepalive 8;
}

# Inside the existing `server { listen 443 ssl; server_name strandz.it; ... }`:

    location / {
        proxy_pass http://fluidmark;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # The page loads a handful of small files; a 30 second timeout is generous and a hung
        # upstream is otherwise invisible to the person waiting.
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

# The existing port 80 block, and the certificate renewal location, stay as they are.
