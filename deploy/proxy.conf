# deploy/proxy.conf
#
# What the strandz.it front door needs in order to send FluidMark to the container. It is a
# location to add inside the existing `server` block for strandz.it in
# /etc/nginx/sites-enabled/strandz.it.conf, not a vhost of its own. That block already carries the
# certificates, the HTTP redirect, an app on 127.0.0.1:6010 at `/` (with a long-timeout
# /api/update-feeds), /diddums, and an include for /jigdaw. A whole-vhost file here would replace
# every one of those.
#
# nginx picks the longest matching prefix, so `/fluidmark/` wins over `/` for everything under it
# and nothing already on the domain is shadowed. That is the reason for a prefix rather than the
# root: the root is the other app's.
#
# The container serves at its own root and knows nothing about the domain. The proxy strips the
# prefix on the way in, and every URL in the pages is relative, which is what makes the prefix
# work and what lets it move later by editing this file alone.
#
# Put it next to the existing `include .../jigdaw.conf;` line, either pasted or as an include of
# this file. Then `nginx -t` and a reload. Port 8080 is where `npm run docker:run` publishes the
# container; change both if something else on the host already has it.

    location /fluidmark/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # The page loads a handful of small files; a 30 second timeout is generous and a hung
        # upstream is otherwise invisible to the person waiting.
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Visiting the prefix without its trailing slash. Without this the request falls through to
    # the app at `/`, which is not FluidMark and would answer with something plausible.
    location = /fluidmark {
        return 301 /fluidmark/;
    }
