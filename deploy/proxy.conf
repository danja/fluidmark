# deploy/proxy.conf
#
# The front door: a vhost for strandz.it that maps /fluidmark/ onto the container.
#
# The split is deliberate. The container serves the site at **its own root**, and the proxy strips
# the prefix on the way in and puts it back on the way out. That way the container knows nothing
# about where it is deployed, so moving it to a different prefix, or to a subdomain root, is a
# change to this file alone.
#
# The alternative, configuring nginx inside the container to serve /fluidmark/ directly, means the
# prefix is baked into the image and every absolute path in the page becomes conditional on it.
# Relative URLs in the page are what make the prefix work, and they work precisely because
# nothing inside knows the prefix.

upstream fluidmark {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name strandz.it;

    # Certificates, wherever they are kept. Named rather than configured here, because a path to a
    # certificate is machine-specific and this file should not carry one.
    ssl_certificate     /etc/letsencrypt/live/strandz.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/strandz.it/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ACME, over plain HTTP, for renewal.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # The site. The prefix is stripped here and added back there, so the container sees /index.html
    # and the browser sees /fluidmark/index.html.
    location /fluidmark/ {
        proxy_pass http://fluidmark/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # The page loads a handful of small files; a 30 second timeout is generous and a hung
        # upstream is otherwise invisible to the person waiting.
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Visiting the prefix without its trailing slash. nginx would otherwise serve the directory
    # index from a redirect that loses the prefix, and the page's relative URLs would then resolve
    # against the host root.
    location = /fluidmark {
        return 301 /fluidmark/;
    }

    # Everything else on this host is somebody else's problem.
    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name strandz.it;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /fluidmark/ {
        return 301 https://strandz.it/fluidmark$request_uri;
    }

    location / {
        return 301 https://strandz.it$request_uri;
    }
}